name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Build and check
        run: gradle -p android assembleRelease lintRelease --no-daemon
      - name: Prepare signing tool
        run: |
          mkdir -p android-delivery
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android-delivery/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-delivery/
          cp android/app/build/reports/lint-results-release.html android-delivery/
      - uses: actions/upload-artifact@v4
        with:
          name: Quiniela-Lab-Android-build
          path: android-delivery/
          retention-days: 7
