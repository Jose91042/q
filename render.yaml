services:
  - type: web
    name: quiniela-lab
    runtime: node
    plan: free
    buildCommand: node --check server.mjs
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
